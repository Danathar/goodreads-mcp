name: Auto issues

# release.yml refuses to release a commit whose `test` check is not green, and
# until this file nothing told anyone that main had gone red. When the `CI`
# workflow fails on a push to main, this opens one tracking issue, or comments
# on it if it is already open.
#
# Deliberately small:
#   - It never checks out or runs repository code, and uses no third-party
#     action. The only thing it runs is `gh`, which is preinstalled.
#   - It never closes the issue. Recovery is a human's call.
#   - `workflow_run` always runs the copy of this file on the default branch, so
#     a pull request cannot change what it does.
#
# The two monthly workflows are watched too. `Release MCPB` fails its
# scheduled run when main still carries the last release's version (nobody ran
# `prepare` that month), and `Agent audit trail` fails when an agent pull
# request touched the agent boundary and was merged by a bot. Either run is
# red in the Actions tab and nowhere else. `Nightly compliance` is the other
# scheduled workflow, and it opens its own drift issue.
#
# `workflows:` lists `name:` values, not file names; renaming a watched
# workflow silently disconnects it, and tests/test_auto_issues_workflow.py
# pins each name and checks every scheduled workflow is watched or reports
# for itself.

on:
  workflow_run:
    workflows: [CI, Release MCPB, Agent audit trail]
    types: [completed]
    branches: [main]

# Two failures arriving together must not both see "no issue yet" and each open
# one. Queue, never cancel: a cancelled run is a failure nobody was told about.
# cancel-in-progress covers only the running report; `queue: max` keeps every
# waiting one. With the default `queue: single`, a newer completion (any push's
# CI run) cancels the report already pending, before its step runs.
concurrency:
  group: auto-issues
  cancel-in-progress: false
  queue: max

permissions:
  issues: write

jobs:
  main-red:
    # Pull-request runs of CI also complete with a conclusion; only a push to
    # main is a red main.
    # A scheduled run is the other case: nobody watches it. Each step below
    # picks one of the two.
    if: github.event.workflow_run.conclusion == 'failure' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open or update the CI-failure issue
        if: github.event.workflow_run.event == 'push' && github.event.workflow_run.name == 'CI'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: "CI failing on main"
          # Event fields are attacker-influenced (a commit message is whatever
          # its author wrote), so they reach the shell only as env vars.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          subject=${COMMIT_MESSAGE%%$'\n'*}
          # Indented code block: whatever the subject contains stays text.
          body=$(printf 'The `CI` workflow failed on a push to `main` on %s.\n\nCommit: %s\nRun: %s\n\nFirst line of the commit message:\n\n    %s\n\n`release.yml` will not release this commit while `test` is not green. This issue is not closed automatically; close it once `main` is green again.\n' \
            "$(date -u +%Y-%m-%d)" "$HEAD_SHA" "$RUN_URL" "$subject")
          # List rather than search: the search index lags, and `in:title` is a
          # word match, not an exact one. Match the exact title AND the Actions
          # bot as author, so an issue anyone else opens with this title is
          # never the one a failure is reported into.
          existing=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE and (.author.login == "app/github-actions" or .author.login == "github-actions[bot]" or .author.login == "github-actions"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

      # Only the scheduled run. A run started by hand has a person watching it.
      - name: Open or update the scheduled-failure issue
        if: github.event.workflow_run.event == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          export TITLE="Scheduled run failing: ${WORKFLOW_NAME}"
          case "$WORKFLOW_NAME" in
            "Release MCPB")
              next='The usual cause is that pyproject.toml and manifest.json still carry the version of the last release. Run `Release MCPB` by hand with `prepare` ticked, merge the version-bump pull request it links, then run it again without `prepare`. The failed step in the run log says which check refused.'
              ;;
            "Agent audit trail")
              next='An agent pull request that touched the agent boundary (`.claude/settings.json`, `.claude/hooks/**`) was merged by a bot, an app or an unknown account. The run summary names it.'
              ;;
            *)
              next='Open the run and read the failed step.'
              ;;
          esac
          body=$(printf 'The scheduled `%s` run failed on %s.\n\nCommit: %s\nRun: %s\n\n%s\n\nThis issue is not closed automatically; close it once a run succeeds.\n' \
            "$WORKFLOW_NAME" "$(date -u +%Y-%m-%d)" "$HEAD_SHA" "$RUN_URL" "$next")
          # The same lookup as the job above: list, exact title, Actions bot.
          existing=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE and (.author.login == "app/github-actions" or .author.login == "github-actions[bot]" or .author.login == "github-actions"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
