name: Release MCPB

# CalVer, YYYY.M.PATCH: 2026.10.0, 2026.10.1, 2026.11.0 (#165).
#
# The 0.1.x line is retired. A year-based number always sorts above it, so
# nobody who installed 0.1.1 is ever offered a downgrade. Tags carry no "v"
# prefix; v0.1.1 is the last tag that does.
#
# The version lives in pyproject.toml and manifest.json, and it changes the
# way every other file here changes: in a pull request, reviewed, and merged
# under the ruleset on main (docs/branch-protection.md). This workflow never
# writes main. It tags a commit that is already there and publishes it, so the
# number it releases is one that passed CI and review, not one a workflow run
# invented.
#
# Three jobs, and a run is only ever the first or the other two:
#
#   * `prepare` opens the version-bump pull request and stops. Nothing is
#     tagged or published, and the only branch it pushes is a release/* one.
#   * `build-pypi` builds the wheel and sdist from a fresh checkout and
#     uploads them, before any job has run third-party code in a tree.
#   * `release` tags the version pyproject.toml carries on the checked-out
#     commit and publishes it: monthly on a schedule, or by hand. It refuses
#     any commit that is not on main, whichever branch it was started from.
#     Guarded; see "Decide whether to release" below, because most months
#     here change only docs, tests and agent config, and a release people are
#     prompted to install should contain something they can observe.
#
# `publish-pypi` follows `release` and uploads the distributions `build-pypi`
# built, only when `release` really published. `publish-registry` then lists
# that PyPI release on the official MCP registry (#180).
#
# The version is never derived from commit messages.

on:
  schedule:
    # 09:00 UTC on the 1st. GitHub disables scheduled workflows after 60 days
    # with no repository activity.
    - cron: "0 9 1 * *"
  workflow_dispatch:
    inputs:
      prepare:
        description: "Open the version-bump pull request instead of releasing"
        type: boolean
        default: false
      version:
        description: "CalVer YYYY.M.PATCH (e.g. 2026.10.0). Leave blank to derive it."
        required: false
      prerelease:
        description: "Publish as a pre-release (version must end b1, rc2, ...)"
        type: boolean
        default: false
      force:
        description: "Release even if nothing under goodreads_mcp/ changed"
        type: boolean
        default: false
      dry_run:
        description: "Validate only - do not tag or publish"
        type: boolean
        default: false

# Nothing is granted workflow-wide; each job asks for what it needs, so a job
# added later cannot quietly inherit the ability to write to this repository.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The one definition of a release number, shared by both jobs so the check
  # guarding the pull request and the check guarding the tag cannot drift
  # apart. Four-digit year, unpadded 1-12 month, unpadded patch, and an
  # optional b1/rc1 pre-release suffix. Valid PEP 440 as written, so PyPI
  # takes it unchanged.
  #
  # Every step applies it with bash's `[[ $value =~ $CALVER_PATTERN ]]`, which
  # anchors to the whole string. `grep -E` anchors to each line, so a value
  # carrying a newline passes when any one line matches.
  CALVER_PATTERN: '^[0-9]{4}\.(1[0-2]|[1-9])\.(0|[1-9][0-9]*)((b|rc)[1-9][0-9]*)?$'

jobs:
  # ------------------------------------------------------------------------
  # Propose the next version. This is the only place the version changes, and
  # it changes through a pull request like anything else.
  # ------------------------------------------------------------------------
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pushes a release/* branch and opens a pull request, never main. The
    # ruleset that governs main governs this pull request too, which is the
    # point: release automation must not become a second route around it.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Derived from the date, not from commit messages: this month's line if
      # it has no stable release yet, otherwise the next patch in it.
      - name: Decide the next version
        id: version
        env:
          # Through the environment, never interpolated into the script below.
          # `${{ }}` is substituted before bash parses the file, so an input
          # containing shell syntax would otherwise become part of the program
          # rather than data for it, and this job can write to the repository.
          GIVEN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          given="$GIVEN_VERSION"

          if [ -n "$given" ]; then
            # Checked before it is used for anything: as a branch name, as a
            # commit message, or written to $GITHUB_OUTPUT, where an unchecked
            # value carrying a newline forges outputs for later steps.
            if ! [[ "$given" =~ $CALVER_PATTERN ]]; then
              echo "::error::'$given' is not CalVer YYYY.M.PATCH (e.g. 2026.10.0)," >&2
              echo "optionally with a b1/rc1 suffix for a pre-release." >&2
              echo "Month must not be zero-padded; no 'v' prefix." >&2
              exit 1
            fi
            version="$given"
            echo "Using the version given: $version"
          else
            month="$(date -u +%Y).$(date -u +%-m)"
            # `|| true` is load-bearing: with no tags yet, git prints nothing,
            # grep -v exits 1 on empty input, and pipefail turns that into a
            # failed step. The no-tags case is exactly the first release.
            latest="$(git tag --list "${month}.*" | grep -vE '(b|rc)[0-9]+$' | sort -V | tail -1 || true)"

            if [ -z "$latest" ]; then
              version="${month}.0"
            else
              version="${month}.$(( ${latest##*.} + 1 ))"
            fi

            echo "Derived $version (latest this month: ${latest:-none})."
          fi

          if git rev-parse --quiet --verify "refs/tags/$version" >/dev/null; then
            echo "::error::Tag $version already exists." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Bump pyproject.toml and manifest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # jq, not sed: it cannot corrupt the JSON, and it fails loudly.
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

          # pyproject.toml is edited as text, so its comments and layout
          # survive, then read back with tomllib: the edit must change the
          # project version and nothing else, or the step fails.
          python3 - <<'PY'
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("pyproject.toml")
          before_text = path.read_text(encoding="utf-8")
          before = tomllib.loads(before_text)

          project = re.search(r"^\[project\]\s*$", before_text, re.M)
          if not project:
              sys.exit("::error::pyproject.toml has no [project] table")
          head, tail = before_text[: project.end()], before_text[project.end() :]
          tail, count = re.subn(r'^version = "[^"\n]*"$', f'version = "{version}"', tail, count=1, flags=re.M)
          if count != 1:
              sys.exit('::error::no `version = "..."` line under [project] in pyproject.toml')
          after_text = head + tail

          after = tomllib.loads(after_text)
          if after.get("project", {}).get("version") != version:
              sys.exit(f"::error::pyproject.toml's project version reads back as {after.get('project', {}).get('version')}, not {version}")
          before["project"]["version"] = version
          if after != before:
              sys.exit("::error::the edit changed more of pyproject.toml than the version")
          path.write_text(after_text, encoding="utf-8")
          PY

          MANIFEST_VERSION="$(jq -r .version manifest.json)"
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "::error::manifest.json reads back as $MANIFEST_VERSION, not $VERSION." >&2
            exit 1
          fi
          git --no-pager diff -- pyproject.toml manifest.json

      - name: Open the pull request
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "::error::pyproject.toml and manifest.json are already at $VERSION." >&2
            echo "If that version has not been released, run this workflow" >&2
            echo "without 'prepare' to tag and publish it." >&2
            exit 1
          fi

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="release/$VERSION"
          git checkout -b "$branch"
          git add pyproject.toml manifest.json
          git commit -m "chore(release): $VERSION"
          git push origin "HEAD:refs/heads/$branch"

          gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$branch" \
            --title "chore(release): $VERSION" \
            --body "Sets the version in \`pyproject.toml\` and \`manifest.json\` to \`$VERSION\`.

          Merging this is what approves the number. The Release MCPB workflow
          then tags the commit that lands and publishes it; it does not change
          the version itself."

          echo "Opened the version-bump pull request for **$VERSION**." >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------
  # Build the distributions PyPI gets, before any third-party code runs.
  # ------------------------------------------------------------------------
  build-pypi:
    if: github.event_name != 'workflow_dispatch' || !inputs.prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its own job, with its own checkout, so the wheel and sdist are built
    # from the tree as merged, not from the tree after `release` has run
    # `pip install -e`, `npx ... pack` and `uv run` on unpinned closures.
    # Any of those could rewrite goodreads_mcp/ before a build in that job,
    # and Trusted Publishing would sign the result. Here the only code that
    # runs before the build is the setup action and hatchling.
    #
    # Runs on a dry run too, and on a month with nothing to release: an
    # artifact publishes nothing, and `publish-pypi` uploads it only after
    # `release` really published. The build failing fails `release`.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # This job's token can only read a public repository, but nothing
          # here needs it, so nothing here gets it.
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build the PyPI distributions
        run: |
          # `uv build` runs only the `[build-system]` backend, hatchling.
          uv build --out-dir dist

      - name: Upload the PyPI distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # Tag an approved commit and publish it. Reads the version; never sets it.
  # ------------------------------------------------------------------------
  release:
    if: github.event_name != 'workflow_dispatch' || !inputs.prepare
    # A failed build is a failed release: nothing is tagged when there is no
    # distribution to publish under the tag.
    needs: build-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pushes a tag and creates a release; no step in this job writes a branch.
    # `checks: read` is for the green-checks gate.
    permissions:
      contents: write
      checks: read
    outputs:
      # True only when the GitHub release was really published: not on a dry
      # run, not on a skipped month, not when a gate refused.
      released: ${{ steps.publish.outcome == 'success' }}
      # The number that was tagged, as read off pyproject.toml and checked
      # against CALVER_PATTERN before it was written to $GITHUB_OUTPUT.
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # This job runs `pip install`, `npx` and `uv run` on unpinned
          # closures. With the default, the checkout leaves this job's
          # `contents: write` token in .git/config for all of them to read.
          # Only "Tag the approved commit" gets it, through its own `env:`.
          # That keeps the token off disk; it does not isolate it. A step
          # in this job can still reach a later step's env (`$GITHUB_ENV`
          # sets `BASH_ENV`; a hook written to .git/hooks runs inside `git
          # tag` and `git push`). Isolation means a separate job, the way
          # `build-pypi` is one; that is tracked apart from this.
          persist-credentials: false

      # The schedule always runs on the default branch. `workflow_dispatch`
      # runs on whichever branch is picked under "Use workflow from", and the
      # commit it checks out is that branch's head. Everything below assumes a
      # commit that reached main through a pull request and the ruleset, so
      # that is checked here instead of trusted from the dropdown. The
      # version-bump branch `prepare` pushes is the easiest one to pick by
      # mistake: it carries the right version and has not been merged.
      #
      # Two checks, because they answer different questions. The ref is what
      # the dropdown chose. The ancestry check asks the remote whether the
      # commit is really on that branch now, so a stale or rewritten ref
      # cannot make an unreviewed commit look reviewed.
      - name: Refuse any commit that is not on main
        env:
          REF: ${{ github.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/$DEFAULT" ]; then
            echo "::error::Releases run from $DEFAULT only; this run is on $REF." >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/$DEFAULT"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Releases run from $DEFAULT only; ${GITHUB_SHA::12} is not on it." >&2
            exit 1
          fi
          echo "${GITHUB_SHA::12} is on $DEFAULT."

      # The scheduled path is opt-in. Merging this workflow must not, by
      # itself, start publishing releases; someone has to decide that and set
      # the variable. A manual run is always allowed: a person is already in
      # the loop.
      - name: Check the schedule is enabled
        id: enabled
        env:
          OPTED_IN: ${{ vars.AUTO_RELEASE_ENABLED == 'true' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$OPTED_IN" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Monthly releases are off. Set the repository variable" >> "$GITHUB_STEP_SUMMARY"
            echo "\`AUTO_RELEASE_ENABLED\` to \`true\` to enable them." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A month whose only commits are docs, tests and agent config has
      # nothing for a user to install, and a release anyway trains people to
      # ignore the update. Only the runtime package counts: every bump pull
      # request touches pyproject.toml and manifest.json, so counting those
      # would make this gate always pass. A dependency-only change in
      # pyproject.toml is the one case it misses; use `force` for that.
      - name: Decide whether to release
        id: decide
        if: steps.enabled.outputs.go == 'true'
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # `|| true` is load-bearing: with no CalVer tags yet, git prints
          # nothing, grep -v exits 1 on empty input, and pipefail turns that
          # into a failed step. That case is exactly the first release. The
          # v0.1.x tags never match the pattern, so they are not counted.
          last="$(git tag --list '[0-9][0-9][0-9][0-9].*' | grep -vE '(b|rc)[0-9]+$' | sort -V | tail -1 || true)"

          if [ -z "$last" ]; then
            echo "No previous CalVer release; this is the first."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$last"..HEAD -- goodreads_mcp | wc -l)"
          echo "Files under goodreads_mcp/ changed since $last: $changed."

          if [ "$changed" -gt 0 ] || [ "$FORCE" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            {
              echo "### No release"
              echo
              echo "Nothing under \`goodreads_mcp/\` changed since **$last**."
              echo "Re-run by hand with \`force\` if you want one anyway."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # An automatic release publishes whatever is on main without a person
      # looking first. The least it can do is refuse when main's own checks
      # are not green. "Green" means two things, and the second is the one
      # that bites: no check may be red or unfinished, and the check the
      # ruleset on main requires (`test`, .github/rulesets/main.json) must
      # have passed. A commit with no check runs at all has nothing red on it.
      # The branches this workflow's own `prepare` job pushes are exactly such
      # commits: a push made with github.token starts no workflow run, so
      # ci.yml never reports on them.
      #
      # Every page is read. The API returns 30 runs a page, newest first, and
      # main's head keeps collecting runs after CI is done: nightly-compliance
      # adds one a day and ai-fix.yml adds one per issue event, each in its
      # own check suite. After a quiet week `test` is not on the first page,
      # and a gate that read only that page would refuse a commit CI passed.
      - name: Require green checks on this commit
        if: steps.decide.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECK: test
        run: |
          set -euo pipefail
          # `--paginate` applies `--jq` to each page, so the runs are flattened
          # and gathered back into one document that both questions read.
          runs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
                    --jq '.check_runs[]' | jq -s '{check_runs: .}')"

          bad="$(jq -r '[.check_runs[]
                         | select(.name != "release")
                         | select((.conclusion // "pending") | IN("success","skipped","neutral") | not)
                         | "\(.name): \(.conclusion // .status)"] | .[]' <<< "$runs")"

          if [ -n "$bad" ]; then
            echo "::error::Not releasing - checks on ${GITHUB_SHA::12} are not green:" >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi

          passed="$(jq -r --arg name "$REQUIRED_CHECK" \
            '[.check_runs[] | select(.name == $name and .conclusion == "success")] | length' <<< "$runs")"

          if [ "$passed" -eq 0 ]; then
            echo "::error::Not releasing - no successful '$REQUIRED_CHECK' check on ${GITHUB_SHA::12}." >&2
            echo "A commit with no checks is one CI never ran on, not one that passed." >&2
            exit 1
          fi
          echo "All checks on ${GITHUB_SHA::12} are green, and '$REQUIRED_CHECK' passed."

      - name: Set up Python 3.11
        if: steps.decide.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 20
        if: steps.decide.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up uv
        if: steps.decide.outputs.go == 'true'
        uses: astral-sh/setup-uv@v6

      - name: Upgrade pip
        if: steps.decide.outputs.go == 'true'
        run: python -m pip install --upgrade pip

      # The number comes off the merged pyproject.toml, not from this run.
      # That file changed in a reviewed pull request, which is what makes the
      # version an approved one; a workflow input can only confirm it.
      - name: Read the version from pyproject.toml
        id: version
        if: steps.decide.outputs.go == 'true'
        env:
          # Through the environment, never interpolated into the script below:
          # this job holds contents: write.
          GIVEN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          given="$GIVEN_VERSION"
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "pyproject.toml on this commit says $version."

          if [ -n "$given" ] && ! [[ "$given" =~ $CALVER_PATTERN ]]; then
            echo "::error::'$given' is not CalVer YYYY.M.PATCH (e.g. 2026.10.0)," >&2
            echo "optionally with a b1/rc1 suffix for a pre-release." >&2
            echo "Month must not be zero-padded; no 'v' prefix." >&2
            exit 1
          fi

          # $GITHUB_OUTPUT is a file of key=value lines, so a value carrying a
          # newline forges outputs for every later step that reads them.
          # Nothing unchecked is written to it.
          if ! [[ "$version" =~ $CALVER_PATTERN ]]; then
            echo "::error::the pyproject.toml version '$version' is not CalVer YYYY.M.PATCH." >&2
            echo "Run this workflow with 'prepare' to open the version-bump pull request." >&2
            exit 1
          fi

          # An explicit input confirms the number; it does not choose it.
          if [ -n "$given" ] && [ "$given" != "$version" ]; then
            echo "::error::asked for $given, but pyproject.toml says $version." >&2
            echo "This workflow tags what main already carries; it does not" >&2
            echo "change the version. Run it with 'prepare' to open the" >&2
            echo "version-bump pull request for $given, and merge that first." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Check manifest.json matches pyproject.toml
        if: steps.decide.outputs.go == 'true'
        run: |
          MVER=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          PVER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$MVER" != "$PVER" ]; then
            echo "::error::manifest.json version ($MVER) != pyproject.toml version ($PVER). Keep them in sync."
            exit 1
          fi

      # Everything that can be wrong is checked before anything is written.
      # Deleting a tag does not un-download a bundle or un-publish a PyPI
      # version.
      - name: Validate the version
        if: steps.decide.outputs.go == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if ! [[ "$VERSION" =~ $CALVER_PATTERN ]]; then
            echo "::error::'$VERSION' is not CalVer YYYY.M.PATCH (e.g. 2026.10.0)," >&2
            echo "optionally with a b1/rc1 suffix for a pre-release." >&2
            echo "Month must not be zero-padded; no 'v' prefix." >&2
            exit 1
          fi

          # The `inputs` context is empty on a scheduled run, so an absent
          # checkbox is an unticked one. Without this the monthly release
          # compares "false" against "" and refuses every stable version.
          prerelease="$PRERELEASE"
          [ -n "$prerelease" ] || prerelease=false

          # The suffix and the checkbox have to agree. Either alone publishes
          # the wrong kind of release: a stable release named 2026.10.0b1, or
          # a beta offered to everyone as the latest.
          case "$VERSION" in
            *b[0-9]*|*rc[0-9]*) has_suffix=true ;;
            *) has_suffix=false ;;
          esac
          if [ "$has_suffix" != "$prerelease" ]; then
            echo "::error::version '$VERSION' and prerelease=$prerelease disagree." >&2
            echo "A pre-release version must end b1/rc1, and a stable one must not." >&2
            exit 1
          fi

          # The tag being free is also what proves the version moved: if this
          # number is already published, main still carries the version of the
          # last release and there is nothing new to tag. The remote is asked
          # too, in case another run tagged it after this checkout.
          # Assigned on its own line so a remote that cannot be reached fails
          # the step instead of reading as "no such tag".
          remote="$(git ls-remote --tags origin "refs/tags/$VERSION")"
          if git rev-parse --quiet --verify "refs/tags/$VERSION" >/dev/null || [ -n "$remote" ]; then
            echo "::error::Tag $VERSION already exists, so pyproject.toml and" >&2
            echo "manifest.json have not been bumped since that release. Run this" >&2
            echo "workflow with 'prepare' to open the version-bump pull request," >&2
            echo "merge it, then release the commit that lands." >&2
            exit 1
          fi

          # A release older than the one people already have is worse than no
          # release. Stable tags only: a beta must never become the number a
          # later stable is measured against. A pre-release is measured by the
          # version it leads up to, so 2026.10.0b1 is refused once 2026.10.0
          # is out, although `sort -V` alone would put the beta after it.
          newest="$(git tag --list '[0-9][0-9][0-9][0-9].*' | grep -vE '(b|rc)[0-9]+$' | sort -V | tail -1 || true)"
          base="$(printf '%s' "$VERSION" | sed -E 's/(b|rc)[0-9]+$//')"
          echo "newest stable tag: ${newest:-none} | releasing: $VERSION"

          if [ -n "$newest" ]; then
            older="$(printf '%s\n%s\n' "$newest" "$base" | sort -V | head -1)"
            if [ "$older" = "$base" ]; then
              echo "::error::$VERSION is not newer than the latest release $newest." >&2
              exit 1
            fi
          fi

      - name: Install test deps and run tests
        if: steps.decide.outputs.go == 'true'
        run: |
          pip install -e ".[test]"
          pytest -q

      - name: Pack MCPB
        if: steps.decide.outputs.go == 'true'
        run: |
          # The bundle ships no dependencies. manifest.json launches the server
          # with `uv run`, which resolves pyproject.toml on the user's machine,
          # so one .mcpb runs on every platform and Python the manifest
          # declares. Resolving them here with `pip install --target` produced
          # a bundle that only started on this runner's platform and Python:
          # four of the packages in mcp's closure are compiled (#89).
          npx -y @anthropic-ai/mcpb@2.1.2 pack
          ls -lh *.mcpb 2>/dev/null || ls -lh ./*.mcpb 2>/dev/null || find . -maxdepth 2 -name "*.mcpb" -ls

      - name: Check the bundle carries no compiled code
        if: steps.decide.outputs.go == 'true'
        run: |
          # A compiled module was built for one platform and one Python; a
          # bundle that carries one cannot also be for the platforms the
          # manifest lists. This is the check that would have failed v0.1.1.
          python - <<'PY'
          import json
          import sys
          import zipfile
          from pathlib import Path

          bundles = sorted(Path(".").glob("*.mcpb"))
          if len(bundles) != 1:
              print(f"::error::expected exactly one .mcpb to check, found {[b.name for b in bundles]}")
              sys.exit(1)
          (bundle,) = bundles
          platforms = json.load(open("manifest.json", encoding="utf-8"))["compatibility"]["platforms"]
          names = zipfile.ZipFile(bundle).namelist()
          compiled = [name for name in names if name.endswith((".so", ".pyd", ".dylib"))]
          if len(platforms) > 1 and compiled:
              print(
                  f"::error::{bundle} declares platforms {platforms} but carries compiled "
                  f"modules built for one of them: {compiled}"
              )
              sys.exit(1)
          print(f"{bundle}: {len(names)} files, {len(compiled)} compiled, platforms {platforms}")
          PY

      - name: Start the packed bundle the way the manifest launches it
        if: steps.decide.outputs.go == 'true'
        run: |
          # Resolve the bundle's dependencies once, here, the way a user's
          # machine will: unpack the .mcpb and run its manifest's own command
          # with `${__dirname}` pointing at the unpacked tree. A file that
          # .mcpbignore drops -- pyproject.toml, the package itself -- fails
          # the release instead of the first install. Empty stdin is EOF on
          # the stdio transport, so a healthy server exits 0 without serving.
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          (bundle,) = sorted(Path(".").glob("*.mcpb"))
          root = Path(os.environ["RUNNER_TEMP"]) / "bundle"
          shutil.rmtree(root, ignore_errors=True)
          zipfile.ZipFile(bundle).extractall(root)
          config = json.load(open(root / "manifest.json", encoding="utf-8"))["server"]["mcp_config"]
          argv = [arg.replace("${__dirname}", str(root)) for arg in (config["command"], *config["args"])]
          print("launching:", *argv)
          sys.exit(subprocess.run(argv, stdin=subprocess.DEVNULL).returncode)
          PY

      - name: Tag the approved commit
        if: steps.decide.outputs.go == 'true' && !inputs.dry_run
        env:
          VERSION: ${{ steps.version.outputs.version }}
          # The checkout above persisted no credentials, so the token is not
          # on disk for the steps before this one to read; it reaches only
          # this step's env and one push. Same job, though: see the note on
          # the checkout for what that does not prevent.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The tag is the only ref this job writes. The commit under it is
          # on main ("Refuse any commit that is not on main" checked, rather
          # than assumed, that), having gone through a pull request and the
          # ruleset, so a protected main needs no bypass for releases.
          git tag -a "$VERSION" -m "Release $VERSION"
          # The same header actions/checkout would have written to .git/config,
          # given to this one command instead of left on disk for every step.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" \
            push origin "refs/tags/$VERSION"

      - name: Create GitHub Release and upload .mcpb
        id: publish
        if: steps.decide.outputs.go == 'true' && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease == true }}
          files: "*.mcpb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarise
        if: steps.decide.outputs.go == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: **$VERSION** is valid and its bundle starts. Nothing was tagged or published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Released **$VERSION**." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean up the bundle (avoid committing)
        if: always()
        run: rm -rf *.mcpb

  publish-pypi:
    # Trusted Publishing (OIDC): no stored token. Only this job can mint an
    # id-token; the release job, which runs tests and npx, cannot. The token
    # signs the `pypi-dist` artifact exactly as `build-pypi` uploaded it, and
    # that job runs no third-party code in its checkout before the build, so
    # the split protects the artifact as well as the token. It runs only
    # after the release job really published, so a dry run, a skipped month
    # or a refused version never reaches PyPI.
    needs: [build-pypi, release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/goodreads-mcp-ai
    permissions:
      id-token: write
    steps:
      - name: Download the PyPI distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-registry:
    # Lists the release on the official MCP registry
    # (registry.modelcontextprotocol.io), which is where MCP clients and
    # directories look for servers; a package on PyPI alone is not found
    # (#180). Authenticates with a GitHub Actions OIDC token, no stored
    # secret: the registry grants a token from this repository the
    # `io.github.Danathar/*` namespace, which is the one server.json names.
    #
    # The registry checks PyPI itself before it accepts the listing: the
    # package version must exist there and its README must carry
    # `mcp-name: io.github.Danathar/goodreads-mcp` (the comment near the top
    # of README.md). So this job runs after `publish-pypi`, and waits for
    # PyPI to serve the version before it publishes.
    #
    # server.json in the tree carries the placeholder version 0.0.0. The one
    # definition of a release number is pyproject.toml, which the release
    # job read and checked; it arrives here as an output, and is written
    # into a copy of server.json for this publish only. Nothing is committed.
    needs: [release, publish-pypi]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Only server.json is read from the tree; no step here needs git.
          persist-credentials: false

      - name: Wait for PyPI to serve the release
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          url="https://pypi.org/pypi/goodreads-mcp-ai/$VERSION/json"
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null "$url"; then
              echo "PyPI serves goodreads-mcp-ai $VERSION."
              exit 0
            fi
            echo "Attempt $attempt: $url not served yet; waiting 10s."
            sleep 10
          done
          echo "::error::PyPI did not serve goodreads-mcp-ai $VERSION within 5 minutes." >&2
          echo "The registry validates the listing against that page, so it cannot be published yet." >&2
          exit 1

      - name: Write the released version into a copy of server.json
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # jq, not sed: it cannot corrupt the JSON, and it fails loudly.
          # Both the server version and the package version: the registry
          # refuses a version it has already seen, and the package version is
          # the PyPI release it validates against.
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.release.json
          if [ "$(jq -r '[.version, .packages[].version] | unique | join(",")' server.release.json)" != "$VERSION" ]; then
            echo "::error::server.release.json does not carry $VERSION in every version field." >&2
            exit 1
          fi
          jq . server.release.json

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          # Latest, on purpose: the registry binds OIDC tokens to an audience
          # that older publishers do not send, and its docs say to re-install
          # when a publish fails with "invalid audience".
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate server.release.json

      - name: Log in to the MCP registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP registry
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          ./mcp-publisher publish server.release.json
          echo "Listed io.github.Danathar/goodreads-mcp **$VERSION** on the MCP registry: https://registry.modelcontextprotocol.io/v0.1/servers?search=goodreads" >> "$GITHUB_STEP_SUMMARY"
