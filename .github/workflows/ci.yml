name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per branch. A new push to a pull request cancels the run for the
# commit it replaced, so the check reports on the head that is actually under
# review. Pushes to main are never cancelled: release.yml refuses to release a
# commit whose check-runs are not green, and a cancelled CI run is not green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this job reads the repository and fetches from PyPI and npm.
# It calls no GitHub API, so read on contents is the whole requirement. Pinning
# it here also stops the token's scope from depending on a repository setting
# that is not visible in the tree.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test deps
        run: pip install -e ".[test]"

      - name: Run tests with coverage gate
        run: pytest -q --cov=goodreads_mcp --cov-report=term-missing --cov-fail-under=55

      # Optional: verify the MCPB bundle can be packed (validates manifest)
      - name: Set up Node for mcpb validation
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate MCPB manifest
        run: |
          npx -y @anthropic-ai/mcpb validate ./manifest.json
