name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Pull requests: one run per pull request. A new push cancels the run for the
# commit it replaced, so the check reports on the head that is actually under
# review.
#
# Pushes to main: one group per commit, so no main run is ever cancelled or
# queued out. `cancel-in-progress: false` alone is not enough: GitHub Actions
# keeps at most one *pending* run per group and replaces that pending run when
# another is queued, so a shared group would still leave an intermediate main
# commit with a cancelled run. release.yml refuses to release a commit whose
# `test` check is not green, and a cancelled CI run is not green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this job reads the repository and fetches from PyPI and npm.
# It calls no GitHub API, so read on contents is the whole requirement. Pinning
# it here also stops the token's scope from depending on a repository setting
# that is not visible in the tree.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test deps
        run: pip install -e ".[test]"

      - name: Run tests with coverage gate
        run: pytest -q --cov=goodreads_mcp --cov-report=term-missing --cov-fail-under=55

      # pyproject.toml's lower bounds are a promise too: an installer keeps an
      # older mcp or httpx that already satisfies them (#207). Resolve every
      # direct dependency to its floor in a separate environment and run the
      # offline suite there (#234). The warning filter covers mcp 1.14-1.29
      # with pydantic-settings 2.15, which prints a harmless
      # IncompleteFieldDefinitionWarning at import (see #220); drop it once
      # the mcp floor is 1.30 or newer.
      - name: Run tests against the declared dependency floors
        env:
          PYTHONWARNINGS: "ignore:Field 'lifespan' has an incomplete definition"
        run: |
          python -m pip install uv==0.12.19
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/floor"
          uv pip install --python "$RUNNER_TEMP/floor/bin/python" --resolution lowest-direct -e ".[test]"
          uv pip list --python "$RUNNER_TEMP/floor/bin/python"
          "$RUNNER_TEMP/floor/bin/python" -m pytest -q -p no:cacheprovider --ignore=tests/e2e

      # Optional: verify the MCPB bundle can be packed (validates manifest)
      - name: Set up Node for mcpb validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate MCPB manifest
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 validate ./manifest.json

  # The bundle launches with `uv run`, which uses whatever Python the user's
  # machine has, or downloads the newest when it has none (#363). The `test`
  # job above runs the floor; this one runs the ceiling. It is deliberately not
  # a matrix: the ruleset requires the check named exactly `test`
  # (.github/rulesets/main.json), and a matrix would rename it. This job is not
  # required, and merge-queue.yml does not copy it.
  test-newest-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test deps
        run: pip install -e ".[test]"

      - name: Run the offline suite on the newest Python
        run: pytest -q -p no:cacheprovider --ignore=tests/e2e -W error::DeprecationWarning
        env:
          PYTHONWARNINGS: "ignore:Field 'lifespan' has an incomplete definition"
