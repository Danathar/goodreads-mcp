name: Merge queue

# Inert until a repository admin adds a `merge_queue` rule to the ruleset on
# main (docs/branch-protection.md, "Merge queue"). It answers only the
# `merge_group` event, which GitHub sends only to a repository whose queue is
# on, so it does nothing on pull requests or pushes today.
#
# Why it exists: the ruleset sets `strict_required_status_checks_policy:
# false`, so a pull request can merge green against a `main` that has moved on.
# A merge queue tests the merged result before it lands. The queue needs a
# workflow that answers `merge_group`; a queue with none leaves the required
# `test` check never reporting on the queue's commit and blocks every merge.
#
# The single job is called `test` so it reports the context the ruleset
# requires (.github/rulesets/main.json). Its steps are a copy of ci.yml's `test`
# job, so the queue gates on exactly what a pull request gates on.
# tests/test_merge_queue_workflow.py fails when the two drift; change both.
on:
  merge_group:
    types: [checks_requested]

# Same scope as ci.yml: this job reads the repository and fetches from PyPI and
# npm, and calls no GitHub API.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test deps
        run: pip install -e ".[test]"

      - name: Run tests with coverage gate
        run: pytest -q --cov=goodreads_mcp --cov-report=term-missing --cov-fail-under=55

      # pyproject.toml's lower bounds are a promise too: an installer keeps an
      # older mcp or httpx that already satisfies them (#207). Resolve every
      # direct dependency to its floor in a separate environment and run the
      # offline suite there (#234). The warning filter covers mcp 1.14-1.29
      # with pydantic-settings 2.15, which prints a harmless
      # IncompleteFieldDefinitionWarning at import (see #220); drop it once
      # the mcp floor is 1.30 or newer.
      - name: Run tests against the declared dependency floors
        env:
          PYTHONWARNINGS: "ignore:Field 'lifespan' has an incomplete definition"
        run: |
          python -m pip install uv==0.12.19
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/floor"
          uv pip install --python "$RUNNER_TEMP/floor/bin/python" --resolution lowest-direct -e ".[test]"
          uv pip list --python "$RUNNER_TEMP/floor/bin/python"
          "$RUNNER_TEMP/floor/bin/python" -m pytest -q -p no:cacheprovider --ignore=tests/e2e

      # Optional: verify the MCPB bundle can be packed (validates manifest)
      - name: Set up Node for mcpb validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Validate MCPB manifest
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 validate ./manifest.json
