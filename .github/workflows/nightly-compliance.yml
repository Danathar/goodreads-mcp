name: Nightly compliance

# The offline suite runs on fixtures and by construction cannot detect a
# Goodreads markup, schema, WAF, or GraphQL-config change. This job runs the
# live suite against the real endpoints so upstream drift surfaces within a
# day instead of at the next release.
#
# Deliberately NOT part of ci.yml: it depends on a third party, which would
# make it an unreliable gate and would hit an unofficial API on every push.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-compliance
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Read QA tuning thresholds
        id: tuning
        run: |
          cfg=.github/auto-qa-tuning.json
          echo "retries=$(jq -r '.live.retries // 1' "$cfg")" >> "$GITHUB_OUTPUT"
          echo "delay=$(jq -r '.live.retry_delay_seconds // 60' "$cfg")" >> "$GITHUB_OUTPUT"

      - name: Run live suite against real Goodreads endpoints
        id: live
        env:
          GOODREADS_LIVE: "1"
          RETRIES: ${{ steps.tuning.outputs.retries }}
          DELAY: ${{ steps.tuning.outputs.delay }}
        run: |
          set -o pipefail
          attempt=0
          # A single failure isn't proof of upstream drift -- transient network
          # errors and rate limiting look the same. Retry before alarming.
          until pytest tests/e2e -q 2>&1 | tee live.log; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "${RETRIES:-1}" ]; then
              echo "live suite failed after $attempt attempt(s)"
              exit 1
            fi
            echo "attempt $attempt failed; retrying in ${DELAY:-60}s"
            sleep "${DELAY:-60}"
          done

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Live endpoint check"
            echo
            echo '```'
            tail -30 live.log 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update a drift issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Nightly live check failing — Goodreads may have changed"
        run: |
          body=$(printf 'The nightly live suite failed on %s.\n\nThis usually means Goodreads changed something upstream, not that a commit broke.\nTriage with the `check-live-endpoints` skill, which maps each symptom to the surface that broke.\n\nRun: %s/%s/actions/runs/%s\n\nLast output:\n\n```\n%s\n```\n' \
            "$(date -u +%Y-%m-%d)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(tail -30 live.log 2>/dev/null)")
          # List rather than search: the search index lags, and `in:title` is a
          # word match, not an exact one. Match the exact title AND the Actions
          # bot as author, so an issue anyone else opens with this title is
          # never the one the nightly reports into.
          existing=$(gh issue list --state open --limit 1000 --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE and (.author.login == "app/github-actions" or .author.login == "github-actions[bot]" or .author.login == "github-actions"))][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
