[project]
# The distribution name on PyPI. `goodreads-mcp` there belongs to an
# unrelated project, so this one publishes as goodreads-mcp-ai. The import
# package (goodreads_mcp) and the console script (goodreads-mcp) are unchanged.
name = "goodreads-mcp-ai"
version = "2026.9.1"
description = "Read-only MCP server for Goodreads (no API required): search, books, shelves, ratings"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSE.MIT"]
authors = [{ name = "Danathar" }]
keywords = ["goodreads", "books", "mcp", "reading"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.0,<2", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
goodreads-mcp = "goodreads_mcp.server:main"
# Same entry point under the distribution name, so `uvx goodreads-mcp-ai`
# works. The registry listing in server.json carries `runtimeHint: uvx`; that
# is a hint, not a launch command every client must use, but a client that
# follows it runs `uvx goodreads-mcp-ai`, and uv refuses that when the
# package ships no executable of that name (#180).
goodreads-mcp-ai = "goodreads_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Danathar/goodreads-mcp"
Repository = "https://github.com/Danathar/goodreads-mcp"
Issues = "https://github.com/Danathar/goodreads-mcp/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goodreads_mcp"]

# Keep agent configuration, CI, docs and tests out of the published sdist.
[tool.hatch.build.targets.sdist]
include = ["/goodreads_mcp", "/README.md", "/LICENSE", "/LICENSE.MIT", "/pyproject.toml"]
